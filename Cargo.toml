[package]
name = "git-account-manager"
version = "1.0.8"
description = "A cross-platform desktop app for managing Git profiles. Switch your Git identity, SSH config, and connected accounts in one click."
authors = ["https://github.com/khasky"]
license = "MIT"
edition = "2021"
# The crate builds two binaries, and both the packager and `cargo run` have to
# be told which one is the application. Without it the console helper wins the
# toss and the installer ships it as the app.
default-run = "git-account-manager"

[lib]
# The `_lib` suffix keeps the library name apart from the binary's, which
# collide on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "git_account_manager_lib"

[[bin]]
name = "git-account-manager"
path = "src/main.rs"

# Git runs this one as the credential helper, and the packager places it beside
# the application, which is where `credential::helper_path` looks for it.
[[bin]]
name = "gam"
path = "src/bin/gam.rs"

[dependencies]
gpui-kit = { version = "0.9.1", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dirs = "6"
keyring-core = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.23"
open = "5"
urlencoding = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
hostname = "0.4"
auto-launch = "0.5"
semver = "1"
minisign-verify = "0.3"
png = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["rt-tokio-crypto-rust"] }
ksni = { version = "0.3", features = ["blocking"] }

# Screenshot capture renders real windows; these are the GPUI crates gpui-kit wraps.
[dev-dependencies]
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.12", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# `cargo packager --release` packages an existing release build.
[package.metadata.packager]
product-name = "Git Account Manager"
identifier = "com.khasky.git-account-manager"
publisher = "Khasky"
copyright = "Copyright (c) 2026 Khasky"
homepage = "https://github.com/khasky/git-account-manager"
license-file = "LICENSE"
category = "DeveloperTool"
out-dir = "target/packager"
binaries = [{ path = "git-account-manager", main = true }, { path = "gam" }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
formats = ["nsis", "wix", "app", "dmg", "appimage", "deb"]
