name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs land as a squash merge, so the message that reaches `main` - the one the
  # version bump and CHANGELOG.md are derived from - is the PR title, and no
  # hook can see it: `commit-msg` only runs on the commits inside the branch.
  # This validates the title's shape; the full rule set (scope-enum, the revert
  # and breaking footers) stays in commitlint.config.js, where a title with no
  # body could never satisfy it.
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the title
      statuses: write # report the result on the PR
    steps:
      # Default type list is conventional-commit-types, the same set commitlint
      # enforces here - see CONTRIBUTING.md -> Commit messages.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A branch's own commits are already gated by the hook, and they are
          # squashed away on merge - only the title survives.
          validateSingleCommit: false

  # Everyday feedback: formatting, lints and tests on the two platforms that
  # carry the most `#[cfg]` branches. No packaging, no signing key, so it also
  # passes on pull requests from forks, which never receive secrets.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libfontconfig-dev

      - name: Install tooling
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Debug artifacts, unlike the release ones the build job caches.
          key: smoke

      # Formatting and lints gate here rather than in a hook: `commit-msg` is the
      # only hook installed, and a fork's clone runs no hook of ours at all.
      - name: Lint tooling
        run: pnpm lint

      - name: Test tooling
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --all-targets

  # The release is created as a draft so nobody downloads a half-uploaded set;
  # finalize-release publishes nothing either, the draft is published by hand.
  create-release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "${TAG#v}" \
              --notes "Builds are in progress. Publish this draft after all platform jobs succeed."

  # The full four-platform package. Only a `v*` tag needs installers, and only a
  # tag has the signing secrets. Use workflow_dispatch to exercise it before
  # tagging whenever the packager config or icons changed - `smoke` does not
  # cover that path.
  build:
    needs: [smoke, create-release]
    if: >-
      always() && needs.smoke.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') && needs.create-release.result == 'success' ||
      github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: appimage,deb
          - platform: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
          # macos-13 retired Dec 2025; Intel macOS builds use macos-15-intel until Aug 2027
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            formats: app,dmg

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libfontconfig-dev libfuse2

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The updater rejects anything not signed with this key, so a build that
      # cannot sign must fail here rather than publish unusable payloads.
      - name: Check signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Build application
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.8 --locked

      - name: Package application
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      # The updater replaces the whole bundle, so macOS gets it as an archive.
      - name: Archive macOS application for the updater
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) architecture=aarch64 ;;
            *) architecture=x64 ;;
          esac
          tar -czf "target/packager/Git-Account-Manager_${architecture}.app.tar.gz" -C target/packager "Git Account Manager.app"

      # The key pair is the one the Tauri releases were signed with, so copies
      # installed before this updater existed still accept these payloads.
      - name: Sign packages
        # The Tauri CLI signs: its minisign 0.7.3 decrypts a key whose password
        # is empty, which the minisign in cargo-packager skips, so that key
        # fails there with 'Wrong password'. The password goes in as an
        # argument so an empty one never turns into an interactive prompt.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for file in target/packager/*-setup.exe target/packager/*.msi target/packager/*.AppImage target/packager/*.deb target/packager/*.dmg target/packager/*.app.tar.gz; do
            npx --yes @tauri-apps/cli@2.11.4 signer sign --password "$KEY_PASSWORD" "$file"
          done

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" --clobber target/packager/*-setup.exe target/packager/*.msi target/packager/*.AppImage target/packager/*.deb target/packager/*.dmg target/packager/*.app.tar.gz target/packager/*.sig

      # A manual run publishes no release, so keep the installers as CI artifacts
      # for download. Tag builds upload to the release instead.
      - name: Upload manual build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/packager/*-setup.exe
            target/packager/*.msi
            target/packager/*.AppImage
            target/packager/*.deb
            target/packager/*.dmg
            target/packager/*.app.tar.gz
          if-no-files-found: error

  # Runs once every platform has uploaded: renames the installers to
  # Git-Account-Manager-<version>-<os>-<arch>[-setup].<ext>, writes latest.json
  # with the signatures embedded, and replaces the placeholder notes with the
  # CHANGELOG section.
  finalize-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: node scripts/rename-release-assets.mjs

      # Every signature the updater checks is now embedded in latest.json, which
      # never points at a .sig asset; the loose files only pad the download list.
      - name: Drop detached signature assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name | select(endswith(".sig"))' |
            while read -r name; do
              gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes
            done

      # GitHub's own generate-notes builds its list from pull requests, and
      # everything here lands on `main` as a direct push. CHANGELOG.md, written
      # by commit-and-tag-version from those same commits, holds the text.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "${TAG#v}" release-notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md
