name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs land as a squash merge, so the message that reaches `main` - the one the
  # version bump and CHANGELOG.md are derived from - is the PR title, and no
  # hook can see it: `commit-msg` only runs on the commits inside the branch.
  # This validates the title's shape; the full rule set (scope-enum, the revert
  # and breaking footers) stays in commitlint.config.js, where a title with no
  # body could never satisfy it.
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the title
      statuses: write # report the result on the PR
    steps:
      # Default type list is conventional-commit-types, the same set commitlint
      # enforces here - see CONTRIBUTING.md -> Commit messages.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A branch's own commits are already gated by the hook, and they are
          # squashed away on merge - only the title survives.
          validateSingleCommit: false

  # Everyday feedback: typecheck, unit tests and a compile of the Rust side on
  # the two platforms that carry `#[cfg]` branches. No bundling, no signing key,
  # so it also passes on pull requests from forks, which never receive secrets.
  smoke:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Debug artifacts, unlike the release ones the build job caches.
          key: smoke

      - name: Typecheck and build frontend
        run: pnpm build:web

      - name: Test and compile Rust
        run: cargo test --all-targets --manifest-path src-tauri/Cargo.toml

  # The full four-platform bundle. Only a `v*` tag needs installers, and only a
  # tag has the signing secrets; running this per commit spent ~40 runner-minutes
  # to rebuild artifacts nobody downloaded. Use workflow_dispatch to exercise it
  # before tagging whenever the bundler config or icons changed — that path is
  # not covered by `smoke`.
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          # macos-13 retired Dec 2025; Intel macOS builds use macos-15-intel until Aug 2027
          - platform: macos-15-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required to sign updater artifacts (latest.json + *.sig). Generate the
          # key pair with `pnpm tauri signer generate` and store both as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The base config has `createUpdaterArtifacts: false` so local
          # `pnpm build:desktop` builds without needing the signing key. CI always
          # merges tauri.updater.conf.json to flip it on and produce signed
          # *.sig + latest.json (requires the secrets above).
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
          tauriScript: pnpm tauri
          # On a `v*` tag push, create/append to a GitHub Release and publish the
          # signed installers + updater manifest (latest.json). Empty on branch/PR
          # runs, where tauri-action only builds (no release).
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Git Account Manager __VERSION__"
          # Fallback body only. The `release-notes` job below replaces this with
          # GitHub's auto-generated notes ("Full Changelog: <prev>...<tag>" link)
          # once every platform's build has finished.
          releaseBody: "Auto-generated release. Existing installs update in-app via the built-in updater."
          releaseDraft: false
          prerelease: false

      # A manual run publishes no release, so keep the installers as CI artifacts
      # for download. Tag builds upload to the release instead.
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: ignore

  # tauri-action publishes the release with the signed updater artifacts but a
  # static body. After every platform build finishes, replace that body with
  # GitHub's auto-generated notes ("What's Changed" + the
  # "Full Changelog: <prev>...<tag>" compare link), keeping the release name.
  # Runs in its own job so it never races tauri-action creating the release.
  release-notes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          release=$(gh api "repos/$REPO/releases/tags/$TAG")
          id=$(echo "$release" | jq -r '.id')
          name=$(echo "$release" | jq -r '.name')
          gh api --method PATCH "repos/$REPO/releases/$id" \
            -f name="$name" \
            -F generate_release_notes=true
