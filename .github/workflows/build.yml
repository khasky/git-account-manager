name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs land as a squash merge, so the message that reaches `main` - the one the
  # version bump and CHANGELOG.md are derived from - is the PR title, and no
  # hook can see it: `commit-msg` only runs on the commits inside the branch.
  # This validates the title's shape; the full rule set (scope-enum, the revert
  # and breaking footers) stays in commitlint.config.js, where a title with no
  # body could never satisfy it.
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the title
      statuses: write # report the result on the PR
    steps:
      # Default type list is conventional-commit-types, the same set commitlint
      # enforces here - see CONTRIBUTING.md -> Commit messages.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A branch's own commits are already gated by the hook, and they are
          # squashed away on merge - only the title survives.
          validateSingleCommit: false

  # Everyday feedback: typecheck, unit tests and a compile of the Rust side on
  # the two platforms that carry `#[cfg]` branches. No bundling, no signing key,
  # so it also passes on pull requests from forks, which never receive secrets.
  smoke:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install

      # `tauri build` makes this same comparison, and only the tag-only `build`
      # job reaches it - so a drifted pair surfaced as a failed release instead
      # of as a failed push. Runs before the Rust steps to fail fast.
      - name: Check Tauri version parity
        run: pnpm check:tauri

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          # Debug artifacts, unlike the release ones the build job caches.
          key: smoke

      - name: Typecheck and build frontend
        run: pnpm build:web

      # Formatting and lints gate here rather than in a hook: `commit-msg` is the
      # only hook installed, and a fork's clone runs no hook of ours at all.
      - name: Lint and format frontend
        run: pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test and compile Rust
        run: cargo test --all-targets --manifest-path src-tauri/Cargo.toml

  # The full four-platform bundle. Only a `v*` tag needs installers, and only a
  # tag has the signing secrets; running this per commit spent ~40 runner-minutes
  # to rebuild artifacts nobody downloaded. Use workflow_dispatch to exercise it
  # before tagging whenever the bundler config or icons changed — that path is
  # not covered by `smoke`.
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          # macos-13 retired Dec 2025; Intel macOS builds use macos-15-intel until Aug 2027
          - platform: macos-15-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required to sign updater artifacts (latest.json + *.sig). Generate the
          # key pair with `pnpm tauri signer generate` and store both as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The base config has `createUpdaterArtifacts: false` so local
          # `pnpm build:desktop` builds without needing the signing key. CI always
          # merges tauri.updater.conf.json to flip it on and produce signed
          # *.sig + latest.json (requires the secrets above).
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
          tauriScript: pnpm tauri
          # On a `v*` tag push, create/append to a GitHub Release and publish the
          # signed installers + updater manifest (latest.json). Empty on branch/PR
          # runs, where tauri-action only builds (no release).
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # The tag keeps its `v` prefix - the workflow trigger, the asset
          # renamer and latest.json all glob it. Only the release title drops it,
          # so the page reads the same version as the CHANGELOG heading.
          # tauri-action substitutes __VERSION__ from src-tauri/tauri.conf.json,
          # which commit-and-tag-version bumps in the same commit as the tag.
          releaseName: __VERSION__
          # Fallback body only. The `release-notes` job below replaces this with
          # GitHub's auto-generated notes ("Full Changelog: <prev>...<tag>" link)
          # once every platform's build has finished.
          releaseBody: "Auto-generated release. Existing installs update in-app via the built-in updater."
          releaseDraft: false
          prerelease: false

      # A manual run publishes no release, so keep the installers as CI artifacts
      # for download. Tag builds upload to the release instead.
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: ignore

  # tauri-action publishes the release with the signed updater artifacts, but
  # under Tauri's own bundle filenames and with a static body. Both are fixed
  # here, after every platform build has finished, in a job of its own so it
  # never races tauri-action creating the release.
  finalize-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Git-Account-Manager-<version>-<os>-<arch>[-setup].<ext> for every
      # installer, with latest.json re-pointed at the new URLs. See the script
      # header for why this is a post-publish rename; `--self-test` covers the
      # naming rules locally.
      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/rename-release-assets.sh

      # Every signature the updater checks is already embedded in latest.json,
      # which the rename step just rewrote - it never fetches a .sig asset. The
      # loose files are 400 bytes each and only pad the download list, so they
      # go once latest.json carries them.
      - name: Drop detached signature assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$REPO/releases/tags/$TAG" \
            --jq '.assets[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api --method DELETE "repos/$REPO/releases/assets/$id"
              echo "dropped $name"
            done

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # GitHub's own generate-notes builds its list from the pull requests in the
      # tag range, and everything here lands on `main` as a direct push - so it
      # returns a bare compare link over an otherwise empty body.
      # CHANGELOG.md, written by commit-and-tag-version from those same commits,
      # already holds the text the page was missing.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "${TAG#v}" release-notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md
